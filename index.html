<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bind Platform - LUKE</title>
    <style>
        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .phone-frame {
            width: 100%;
            max-width: 480px;
            min-height: 85vh;
            background-color: #0a0a0a;
            border-radius: 18px;
            padding: 24px 20px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.1);
            border: 1px solid #333333;
            box-sizing: border-box;
            transition: filter 0.4s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            max-height: 98vh;
            overflow-y: auto;
        }

        .phone-frame::-webkit-scrollbar {
            display: none;
        }

        .blurred {
            filter: blur(8px);
            pointer-events: none;
            user-select: none;
        }

        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
            box-sizing: border-box;
        }

        .login-card {
            width: 100%;
            max-width: 360px;
            background-color: #111111;
            border-radius: 16px;
            padding: 24px;
            border: 1px solid #444;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
            text-align: center;
        }

        .login-logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 12px auto;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            display: block;
        }

        .login-input {
            width: 100%;
            padding: 12px;
            margin: 14px 0;
            background-color: #000000;
            border: 1px solid #555;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            text-align: center;
            font-family: inherit;
        }

        .login-input:focus {
            border-color: #ffffff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
        }

        .login-btn {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: inherit;
        }

        .error-msg {
            color: #cccccc;
            background-color: #222;
            border: 1px solid #555;
            padding: 8px;
            font-size: 12px;
            margin-top: 10px;
            display: none;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        .app-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .app-logo-img {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 8px auto;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            display: block;
        }

        .app-title {
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .inapp-login-card {
            background-color: #111111;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
        }

        .input-group {
            margin-bottom: 12px;
            text-align: left;
        }

        .input-label {
            font-size: 11px;
            font-weight: bold;
            color: #cccccc;
            margin-bottom: 5px;
            display: block;
            letter-spacing: 0.5px;
        }

        .inapp-input {
            width: 100%;
            padding: 10px;
            background-color: #000000;
            border: 1px solid #555;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            box-sizing: border-box;
            outline: none;
            font-family: inherit;
        }

        .inapp-input:focus {
            border-color: #ffffff;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
        }

        .generated-output-box {
            width: 100%;
            min-height: 120px;
            background-color: #000000;
            border: 1px solid #333;
            border-radius: 8px;
            color: #cccccc;
            font-size: 12px;
            padding: 10px;
            box-sizing: border-box;
            font-family: inherit;
            line-height: 1.5;
            white-space: pre-line;
            overflow-y: auto;
            max-height: 150px;
        }

        .inapp-btn {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 11px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: inherit;
            margin-top: 6px;
        }

        .footer-note {
            font-size: 10px;
            color: #666666;
            text-align: center;
            line-height: 1.3;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div id="password-form-box" class="login-card">
            <img src="https://raw.githubusercontent.com/Lukebindtools/web/main/a4c0b1af253197d4837ff6760d5b81c0.jpg" alt="Logo" class="login-logo">
            <div class="app-title">SECURITY LOCK</div>
            <div class="app-subtitle" style="margin-top:4px; font-size:12px; color:#aaa;">Enter
