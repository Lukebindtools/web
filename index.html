<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bind Platform - LUKE v3</title>
    <style>
        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .phone-frame {
            width: 100%;
            max-width: 480px;
            min-height: 85vh;
            background-color: #0a0a0a;
            border-radius: 18px;
            padding: 24px 20px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.1);
            border: 1px solid #333333;
            box-sizing: border-box;
            transition: filter 0.4s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            max-height: 98vh;
            overflow-y: auto;
            position: relative;
        }

        .phone-frame::-webkit-scrollbar {
            display: none;
        }

        .blurred {
            filter: blur(8px);
            pointer-events: none;
            user-select: none;
        }

        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
            box-sizing: border-box;
        }

        .login-card {
            width: 100%;
            max-width: 360px;
            background-color: #111111;
            border-radius: 16px;
            padding: 24px;
            border: 1px solid #444;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
            text-align: center;
        }

        .login-logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 12px auto;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            display: block;
        }

        .login-input {
            width: 100%;
            padding: 12px;
            margin: 14px 0;
            background-color: #000000;
            border: 1px solid #555;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            text-align: center;
            font-family: inherit;
        }

        .login-input:focus {
            border-color: #ffffff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
        }

        .login-btn {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: inherit;
        }

        .error-msg {
            color: #cccccc;
            background-color: #222;
            border: 1px solid #555;
            padding: 8px;
            font-size: 12px;
            margin-top: 10px;
            display: none;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        .app-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .app-logo-img {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 8px auto;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            display: block;
        }

        .app-title {
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .inapp-login-card {
            background-color: #111111;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
        }

        .input-group {
            margin-bottom: 12px;
            text-align: left;
        }

        .input-label {
            font-size: 11px;
            font-weight: bold;
            color: #cccccc;
            margin-bottom: 5px;
            display: block;
            letter-spacing: 0.5px;
        }

        .inapp-input {
            width: 100%;
            padding: 10px;
            background-color: #000000;
            border: 1px solid #555;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            box-sizing: border-box;
            outline: none;
            font-family: inherit;
        }

        .inapp-input:focus {
            border-color: #ffffff;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
        }

        .generated-output-box {
            width: 100%;
            min-height: 160px;
            background-color: #000000;
            border: 1px solid #333;
            border-radius: 8px;
            color: #cccccc;
            font-size: 12px;
            padding: 10px;
            box-sizing: border-box;
            font-family: inherit;
            line-height: 1.5;
            white-space: pre-line;
            overflow-y: auto;
            max-height: 220px;
        }

        .inapp-btn {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 11px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: inherit;
            margin-top: 6px;
        }

        .copy-btn {
            width: 100%;
            background: #333333;
            color: #ffffff;
            border: 1px solid #555;
            padding: 8px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: inherit;
            margin-top: 6px;
        }

        .copy-btn:hover {
            background: #444444;
            border-color: #fff;
        }

        .footer-note {
            font-size: 10px;
            color: #666666;
            text-align: center;
            line-height: 1.3;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- Intro Password Lock Overlay -->
    <div id="login-overlay">
        <div id="password-form-box" class="login-card">
            <img src="https://raw.githubusercontent.com/Lukebindtools/web/main/a4c0b1af253197d4837ff6760d5b81c0.jpg" alt="Logo" class="login-logo">
            <div class="app-title">SECURITY LOCK</div>
            <div class="app-subtitle" style="margin-top:4px; font-size:12px; color:#aaa;">Enter access code</div>
            <input type="text" id="intro-password-box" class="login-input" oninput="convertToPassword(this)">
            <button type="button" id="unlock-btn" class="login-btn">Unlock</button>
            <div id="error-message" class="error-msg"></div>
        </div>
    </div>

    <!-- Main Content -->
    <div id="main-content" class="phone-frame blurred">
        <div>
            <div class="app-header">
                <img src="https://raw.githubusercontent.com/Lukebindtools/web/main/a4c0b1af253197d4837ff6760d5b81c0.jpg" alt="Logo" class="app-logo-img">
                <div class="app-title">LUKE v3</div>
            </div>

            <!-- Card Generator Section -->
            <div class="inapp-login-card">
                <div style="text-align: center; font-size: 13px; font-weight: bold; letter-spacing: 1px; margin-bottom: 12px;">
                    CARD GENERATOR
                </div>

                <div class="input-group">
                    <label class="input-label">Format: Bin|Expiry|Year|CVV</label>
                    <input type="text" id="raw-card-box" class="inapp-input" value="">
                </div>

                <div class="input-group">
                    <label class="input-label">Quantity to Generate (Max: 100,000)</label>
                    <input type="number" id="quantity-box" class="inapp-input" value="" min="1" max="100000">
                </div>

                <div class="input-group">
                    <label class="input-label">Generated Output</label>
                    <div id="output-box" class="generated-output-box"></div>
                </div>

                <button onclick="generateNewData()" class="inapp-btn">GENERATE NEW DATA</button>
                <button onclick="copyOutputData()" class="copy-btn">COPY OUTPUT</button>
            </div>
        </div>

        <div class="footer-note">Note: Works only for authorized platforms.</div>
    </div>

    <script>
        function convertToPassword(inputElement) {
            if (inputElement.value.length > 0) {
                inputElement.type = 'password';
            } else {
                inputElement.type = 'text';
            }
        }

        function checkIntroPassword() {
            let inputVal = document.getElementById('intro-password-box').value.trim();
            let errorMsg = document.getElementById('error-message');
            
            if (inputVal === "") {
                errorMsg.innerText = "[!] PLEASE ENTER THE ACCESS CODE";
                errorMsg.style.display = 'block';
            } else if (inputVal === "122333") {
                errorMsg.style.display = 'none';
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('main-content').classList.remove('blurred');
            } else {
                errorMsg.innerText = "[!] INVALID ACCESS CODE";
                errorMsg.style.display = 'block';
            }
        }

        document.getElementById('unlock-btn').addEventListener('click', checkIntroPassword);
        document.getElementById('intro-password-box').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') { 
                checkIntroPassword(); 
            }
        });

        function generateNewData() {
            let rawInput = document.getElementById('raw-card-box').value.trim();
            let quantityInput = document.getElementById('quantity-box').value.trim();
            let outputBox = document.getElementById('output-box');

            if (rawInput === "") {
                outputBox.innerText = "";
                return;
            }

            // Check if quantity is empty
            if (quantityInput === "") {
                outputBox.innerText = "[!] PLEASE ENTER QUANTITY";
                return;
            }

            let invalidCheckRegex = /[^0-9|xX]/;
            if (invalidCheckRegex.test(rawInput)) {
                outputBox.innerText = "[!] INVALID BIN";
                return;
            }

            let parts = rawInput.split('|');
            let binPattern = parts[0] || "";

            if (binPattern === "" || /^[a-zA-Z]+$/.test(binPattern)) {
                outputBox.innerText = "[!] INVALID BIN";
                return;
            }

            let count = parseInt(quantityInput, 10);
            if (isNaN(count) || count < 1) {
                outputBox.innerText = "[!] PLEASE ENTER QUANTITY";
                return;
            }
            if (count > 100000) count = 100000;

            let monthPattern = parts[1] || "xx";
            let yearPattern = parts[2] || "28";
            let cvvPattern = parts[3] || "xxx";

            let results = [];
            
            for (let i = 0; i < count; i++) {
                let generatedBin = "";
                for (let char of binPattern) {
                    if (char.toLowerCase() === 'x') {
                        generatedBin += Math.floor(Math.random() * 10);
                    } else {
                        generatedBin += char;
                    }
                }
                while (generatedBin.length < 16) {
                    generatedBin += Math.floor(Math.random() * 10);
                }

                let generatedMonth = "";
                for (let char of monthPattern) {
                    if (char.toLowerCase() === 'x') {
                        generatedMonth += Math.floor(Math.random() * 10);
                    } else {
                        generatedMonth += char;
                    }
                }
                
                let monthNum = parseInt(generatedMonth, 10);
                if (generatedMonth === "" || generatedMonth.includes('x') || isNaN(monthNum) || monthNum < 1 || monthNum > 12) {
                    generatedMonth = String(Math.floor(1 + Math.random() * 12)).padStart(2, '0');
                } else {
                    generatedMonth = String(monthNum).padStart(2, '0');
                }

                let generatedYear = "";
                for (let char of yearPattern) {
                    if (char.toLowerCase() === 'x') {
                        generatedYear += Math.floor(Math.random() * 10);
                    } else {
                        generatedYear += char;
                    }
                }
                if (generatedYear === "") generatedYear = "28";

                let generatedCvv = "";
                for (let char of cvvPattern) {
                    if (char.toLowerCase() === 'x') {
                        generatedCvv += Math.floor(Math.random() * 10);
                    } else {
                        generatedCvv += char;
                    }
                }
                if (generatedCvv === "" || generatedCvv.includes('x')) {
                    generatedCvv = String(Math.floor(100 + Math.random() * 900));
                }

                results.push(generatedBin + "|" + generatedMonth + "|" + generatedYear + "|" + generatedCvv);
            }
            outputBox.innerText = results.join('\n');
        }

        function copyOutputData() {
            let outputText = document.getElementById('output-box').innerText;
            if (!outputText || outputText.includes("[!] INVALID BIN") || outputText.includes("[!] PLEASE ENTER QUANTITY")) {
                return;
            }
            navigator.clipboard.writeText(outputText).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }
    </script>
</body>
</html>
